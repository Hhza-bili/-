plugins { id 'com.android.application' }

android {
    namespace 'org.dsh.whalepet'
    compileSdk 34

    defaultConfig {
        applicationId "org.dsh.whalepet"
        minSdk 24
        targetSdk 33
        versionCode 3
        versionName "2.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding = "UTF-8"
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
