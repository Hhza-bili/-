name: build-apk

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 使用 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 构建 APK
        run: |
          cd android-native
          gradle assembleDebug --no-daemon --stacktrace

      - name: 校验产物
        run: |
          ls -la android-native/app/build/outputs/apk/debug/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: whale-pet-apk
          path: android-native/app/build/outputs/apk/debug/*.apk
          retention-days: 30
